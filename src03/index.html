<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson03 | Summer2026 KCG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>KCGにようこそ！</h1>
    <p>プログラミングは推し活です。</p>
    <img id="base-image" src="https://www.kcg.ac.jp/images/index/main_01.webp" alt="oshi" />
    <canvas id="canvas"></canvas>

    <div class="controls">
      <!-- 置き換え元の色 -->
      <div class="tool-group">
        <span>1. 置き換える色 (クリックで取得):</span>
        <div style="display: flex; gap: 10px; align-items: center">
          <div id="src-preview" class="color-box" style="background-color: #ffffff">(元)</div>
          <div>
            <div id="src-rgb-label" class="hex-label">RGB: (255, 255, 255)</div>
            <div id="src-hex-label" class="hex-label">HEX: #ffffff</div>
          </div>
        </div>
      </div>

      <!-- 置き換え後の色 -->
      <div class="tool-group">
        <label for="color-chooser">2. 新しい色 (選択):</label>
        <div style="display: flex; gap: 10px; align-items: center">
          <div id="dst-preview" class="color-box" style="background-color: #ffffff">(新)</div>
          <div>
            <input type="color" id="color-chooser" value="#ffffff" />
            <div id="dst-hex-label" class="hex-label">HEX: #ffffff</div>
          </div>
        </div>
      </div>

      <div class="tool-group" style="border: none">
        <button id="replace-btn">3. 選択した色を置換</button>
        <button id="reset-btn" style="background-color: #fdd">リセット</button>
      </div>
    </div>

    <!-- 1つ前のレッスンに戻るリンクに修正 -->
    <a href="../src02/index.html">Lesson02へ</a>
    <!-- 次のレッスンへのリンクも修正 -->
    <a href="../src04/index.html">Lesson04へ</a>

    <script src="main.js"></script>
  </body>
</html>
